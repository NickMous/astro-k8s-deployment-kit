name: Reusable - Cleanup Staging

# Reusable workflow that removes a branch's staging environment from the Flux
# fleet repo. Callers wire it to the `delete` event (auto-cleanup when a branch
# is deleted) and/or workflow_dispatch (manual).

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Used in the fleet repo path apps/<app-name>/'
        required: true
        type: string
      fleet-repo:
        description: 'OWNER/repo of the Flux fleet repo'
        required: true
        type: string
      branch-name:
        description: 'Branch / environment name to remove (will be sanitized)'
        required: true
        type: string
    secrets:
      FLEET_REPO_TOKEN:
        required: true
      FLUX_WEBHOOK_URL:
        required: false

jobs:
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fleet-infra repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.fleet-repo }}
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Generate slug
        id: branch
        env:
          BRANCH_INPUT: ${{ inputs.branch-name }}
        run: |
          # Must match the slug rule in deploy-staging.yaml exactly, or cleanup
          # looks for a directory that was never created under that name.
          BRANCH_SLUG=$(echo "$BRANCH_INPUT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-42 | sed 's/-$//')
          echo "name=$BRANCH_INPUT" >> "$GITHUB_OUTPUT"
          echo "slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Remove branch environment and update root kustomization
        env:
          APP: ${{ inputs.app-name }}
          BRANCH_SLUG: ${{ steps.branch.outputs.slug }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          STAGING_ROOT="apps/${APP}/staging-branches"
          BRANCH_DIR="${STAGING_ROOT}/${BRANCH_SLUG}"

          if [ ! -d "$STAGING_ROOT" ]; then
            echo "No staging root at ${STAGING_ROOT} — nothing to clean up"
            exit 0
          fi

          if [ -d "$BRANCH_DIR" ]; then
            rm -rf "$BRANCH_DIR"
            echo "Removed ${BRANCH_DIR}"
          else
            echo "No staging config found for ${BRANCH_SLUG}"
          fi

          cd "$STAGING_ROOT"
          {
            echo "# Root kustomization for staging branches"
            echo "# Auto-generated by GitHub Actions"
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo ""
            echo "resources:"
          } > kustomization.yaml
          for dir in */; do
            if [ -f "${dir}kustomization.yaml" ]; then
              echo "  - ${dir}" >> kustomization.yaml
            fi
          done
          grep -q "^  - " kustomization.yaml || echo "  []" >> kustomization.yaml

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "$STAGING_ROOT"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(flux): cleanup staging ${BRANCH_SLUG}" \
            -m "Branch: ${BRANCH_NAME}"

          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push rejected, rebasing onto origin (attempt ${attempt})"
            git pull --rebase --autostash
            sleep "$((attempt * 3))"
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push cleanup commit to the fleet repo after 5 attempts"
            exit 1
          fi

      - name: Trigger Flux reconciliation
        if: vars.FLUX_WEBHOOK_ENABLED == 'true'
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
          BRANCH_SLUG: ${{ steps.branch.outputs.slug }}
        run: |
          curl -X POST "$FLUX_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"cleanup\", \"branch\": \"$BRANCH_SLUG\"}" \
            --fail --silent --show-error || echo "Webhook notification failed (non-fatal)"
        continue-on-error: true
