# A Node (@astrojs/node standalone) pod running the same Astro project as the
# nginx pod next to it, for CMS live preview.
#
# Deliberately close to base/deployment.yaml — same port, same hardening, same
# pull secret — so the two pods differ only where they have to: the runtime is
# node instead of nginx, which means uid 1000, no nginx volumes, and config
# arriving as environment variables rather than a mounted server block.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview
  labels:
    app.kubernetes.io/name: preview
    app.kubernetes.io/component: web
spec:
  # One is enough: the only client is the CMS preview iframe. Raising this is
  # safe, but note that the pdb component selects `name: app` only, so a
  # preview pod is never covered by a PodDisruptionBudget and a node drain can
  # always evict it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsNonRoot: true
        # uid/gid of the `node` user in the official node images. The static
        # pod runs as 101 (nginx) instead.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Placeholder, distinct from the static pod's `app-image` so an
          # overlay can point the two at different tags of the same package:
          #
          #   images:
          #     - name: app-image
          #       newName: ghcr.io/you/site
          #       newTag: prod-...
          #     - name: preview-image
          #       newName: ghcr.io/you/site
          #       newTag: preview-...
          image: preview-image
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # HOST and PORT live in the overlay's app-preview-config. Astro's node
          # adapter binds localhost without HOST=0.0.0.0, and the kubelet's
          # probes would never reach it.
          #
          # It is not generated here: `behavior: merge` only works against a
          # generator declared in a resource base, never one declared in a
          # component, so a component-owned ConfigMap could not be extended by
          # the overlay.
          envFrom:
            - configMapRef:
                name: app-preview-config
            - secretRef:
                name: app-preview-secret
                optional: true
          volumeMounts:
            # sharp and Node both want somewhere to write under
            # readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # `/` rather than a dedicated health route: in a hybrid build the home
          # page is a prerendered file the standalone server reads off disk, so
          # this is cheap and still proves the process is serving. A fully
          # server-rendered project should point these at its own health route,
          # or fall back to a tcpSocket probe.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
