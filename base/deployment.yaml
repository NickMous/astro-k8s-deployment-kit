apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/component: web
    spec:
      # Pull secret for the private GHCR package. `ghcr-login-secret` is the
      # name fleet-infra's general-secrets creates in every app namespace;
      # patch it in your overlay if yours differs. Harmless when the package
      # is public — kubelet ignores a missing optional pull.
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsNonRoot: true
        # uid/gid of the nginx user in nginxinc/nginx-unprivileged.
        # The ssr component overrides this to 1000 (node).
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Placeholder. Overlays point this at the project's own image via
          # `images: [{name: app-image, newName: ghcr.io/…}]`, or Flux image
          # automation rewrites the tag in the fleet repo.
          image: app-image
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # nginx writes its pid to /tmp and buffers bodies under
            # /var/cache/nginx — both needed for readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: app-nginx-config
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
