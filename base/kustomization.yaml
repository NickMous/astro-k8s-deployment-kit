apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# The nginx server config ships as a ConfigMap so projects inherit config
# fixes via a ?ref= bump instead of rebuilding their image. The generated
# name carries a content hash, so editing the config rolls the pods.
configMapGenerator:
  - name: app-nginx-config
    files:
      - default.conf=nginx-default.conf
    options:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/component: web

# Images are set in overlays (placeholder name: app-image).
