# Static file server for an Astro build.
#
# Mounted into the pod from the `app-nginx-config` ConfigMap (see
# base/kustomization.yaml), so changes here reach every project on its next
# ?ref= bump — no image rebuild needed.
#
# Runs inside the unprivileged nginx image: non-root, listening on 8080.

# Cache-Control is decided here rather than per-location on purpose: an
# `add_header` inside a location block *replaces* every header inherited from
# the server block, which silently drops the security headers below. One
# server-level add_header driven by this map keeps both sets on every response.
#
# Regex entries are evaluated top to bottom; first match wins.
map $uri $astro_cache_control {
    # HTML and everything unrecognised: always revalidate so a new deploy is
    # visible immediately.
    default                                       "no-cache";

    # Astro's content-hashed build output — safe to cache forever.
    "~^/_astro/"                                  "public, max-age=31536000, immutable";

    # Files copied verbatim from public/ — not hashed, so cache a month.
    "~*\.(?:ico|jpe?g|png|webp|avif|gif|svg|woff2?|ttf|otf|eot|mp4|webm)$"  "public, max-age=2592000";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # Keep redirects relative — the pod listens on 8080 behind an ingress, so an
    # absolute redirect would leak http://<pod>:8080/ to the client.
    absolute_redirect off;

    # brotli first (better ratio); gzip as the fallback for older clients.
    # The *_static variants serve the .br / .gz siblings written at build time.
    brotli_static   on;
    brotli          on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css text/xml
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    gzip_static     on;
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    add_header Cache-Control          $astro_cache_control              always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Astro emits directory-style routes: /en/sponsorship -> /en/sponsorship/index.html.
    # Resolving index.html directly returns 200 for the extensionless URL instead of
    # redirecting to the trailing-slash form, keeping the served URL canonical.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # These locations exist only to silence the access log. Deliberately no
    # add_header here — that would drop the inherited headers above.
    location /_astro/ {
        access_log off;
    }

    location ~* \.(?:ico|jpe?g|png|webp|avif|gif|svg|woff2?|ttf|otf|eot)$ {
        access_log off;
    }

    # Astro writes dist/404.html for the project's 404 page. If the site has
    # none, nginx falls back to its built-in error page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Liveness/readiness probe target. `default_type` rather than an
    # add_header — the latter appends a second Content-Type next to the
    # default application/octet-stream instead of replacing it.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Never serve dotfiles, but keep /.well-known reachable (ACME, etc.).
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
