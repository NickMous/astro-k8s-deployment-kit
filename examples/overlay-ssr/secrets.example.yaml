# Runtime secrets for the SSR process. The ssr component mounts this as
# `envFrom: secretRef: app-secret` (optional: true, so it may be absent).
# In a real project: SOPS-encrypted, or generated by External Secrets — the
# name is what matters, kustomize applies the namePrefix for you.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  API_TOKEN: change-me
