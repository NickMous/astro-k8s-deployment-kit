# In a real project this is SOPS-encrypted (secrets.sops.yaml) and listed under
# that name in kustomization.yaml + generator/kustomization.yaml.tmpl.
#
# Generate the htpasswd line with:
#   htpasswd -nbB preview 'some-password'
apiVersion: v1
kind: Secret
metadata:
  name: app-staging-basic-auth
type: Opaque
stringData:
  users: "preview:$2y$05$replace-with-a-real-bcrypt-hash"
